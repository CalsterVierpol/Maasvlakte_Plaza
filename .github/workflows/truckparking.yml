name: Truckparking logger

on:
  schedule:
    # elk uur op minuut 3 (UTC). Bewust niet precies op :00,
    # dan is GitHub druk en lopen runs vaker vertraging op.
    - cron: "3 * * * *"
  workflow_dispatch:   # handmatig starten via de knop "Run workflow"

permissions:
  contents: write

concurrency:
  group: truckparking-logger
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v5

      - name: Bezetting ophalen en loggen
        run: python3 truckparking_logger.py --map data

      - name: Resultaat opslaan in de repository
        if: always()
        run: |
          git config user.name "truckparking-logger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Niets nieuws om op te slaan"
            exit 0
          fi
          git commit -m "Log $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep 5
          done
          echo "Opslaan mislukt na 3 pogingen"
          exit 1
